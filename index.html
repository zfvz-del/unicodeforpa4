<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #18312f;
      background: #f5f0e6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: linear-gradient(135deg, #f5f0e6 0%, #e1efe8 100%);
    }

    main {
      width: min(100%, 720px);
      padding: clamp(2rem, 8vw, 5rem);
      border: 1px solid rgba(24, 49, 47, 0.14);
      background: rgba(255, 253, 248, 0.8);
      box-shadow: 0 24px 70px rgba(24, 49, 47, 0.12);
      text-align: center;
    }

    p {
      margin: 0 0 1rem;
      color: #bd5b3c;
      font: 700 0.8rem/1.2 system-ui, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 400;
      line-height: 0.95;
    }

    .welcome {
      max-width: 34rem;
      margin: 1.5rem auto 0;
      color: #48615d;
      font: 1.05rem/1.7 system-ui, sans-serif;
    }

    .unicode-copy {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .unicode-value,
    .copy-button {
      border: 1px solid rgba(24, 49, 47, 0.2);
      border-radius: 0.35rem;
      padding: 0.75rem 1rem;
      font: 1rem/1.2 system-ui, sans-serif;
    }

    .unicode-value {
      min-width: 8rem;
      color: #18312f;
      background: #fffdf8;
      text-align: center;
    }

    .copy-button {
      color: #fffdf8;
      background: #bd5b3c;
      cursor: pointer;
    }

    .copy-button:hover { background: #a94d32; }
  </style>
</head>
<body>
  <main>
    <p>unicodeforpa4</p>
    <h1>Hello, world.</h1>
    <div class="welcome">Your new HTML page is ready.</div>
    <div class="unicode-copy">
      <output class="unicode-value" id="unicode-value">b</output>
      <button class="copy-button" id="copy-button" type="button">Copy</button>
    </div>
  </main>
  <script>
    const value = document.querySelector('#unicode-value').textContent;
    const button = document.querySelector('#copy-button');

    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(value);
        button.textContent = 'Copied';
        setTimeout(() => { button.textContent = 'Copy'; }, 1200);
      } catch {
        button.textContent = 'Select text to copy';
      }
    });
  </script>
</body>
</html>
